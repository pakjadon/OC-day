<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Your Perfect OC Day</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body { background: #f5f5f3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
  .app { max-width: 430px; margin: 0 auto; background: #fff; min-height: 100vh; }

  /* COVER */
  .cover { min-height: 100vh; background: #0a0a0a; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.42; }
  .cover-top { position: relative; z-index: 2; padding: 64px 26px 0; }
  .cover-date-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.22); border-radius: 20px; padding: 7px 14px; margin-bottom: 24px; }
  .cover-date-pill span { font-size: 12px; color: rgba(255,255,255,0.88); letter-spacing: 0.05em; }
  .cover-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.42); margin-bottom: 12px; }
  .cover-h1 { font-size: 44px; font-weight: 700; color: #fff; line-height: 1.06; letter-spacing: -1.5px; }
  .cover-h1 em { font-style: italic; font-weight: 300; color: rgba(255,255,255,0.6); }
  .cover-credit { font-size: 13px; color: rgba(255,255,255,0.32); margin-top: 16px; letter-spacing: 0.02em; }
  .cover-bottom { position: relative; z-index: 2; padding: 0 26px 44px; }
  .cover-cats { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 24px; }
  .cover-cat { font-size: 12px; padding: 6px 12px; border-radius: 20px; border: 0.5px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.52); display: flex; align-items: center; gap: 5px; }
  .cover-divider { width: 36px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; margin: 0 auto 20px; }
  .cover-cta { width: 100%; padding: 17px; background: #fff; color: #0a0a0a; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: -0.3px; }
  .cover-cta:active { opacity: 0.85; transform: scale(0.99); }

  /* MAIN */
  .main-view { display: none; }
  .main-view.open { display: block; }

  .topbar { padding: 20px 16px 12px; border-bottom: 1px solid #f0f0ee; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: #fff; z-index: 10; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: #f5f5f3; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #111; flex-shrink: 0; }
  .back-btn:active { opacity: 0.6; }
  .topbar-title { font-size: 18px; font-weight: 700; color: #111; letter-spacing: -0.4px; }
  .topbar-date { font-size: 12px; color: #888; margin-top: 1px; }

  .cats { display: flex; gap: 7px; padding: 11px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #f0f0ee; position: sticky; top: 67px; background: #fff; z-index: 9; }
  .cats::-webkit-scrollbar { display: none; }
  .cat-btn { flex-shrink: 0; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 20px; border: 1px solid #e0e0de; background: #fff; color: #666; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .cat-btn.active { background: #111; color: #fff; border-color: #111; }

  .section-head { padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 18px; font-weight: 700; color: #111; letter-spacing: -0.4px; }
  .section-sub { font-size: 12px; color: #999; }

  .spot-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 32px; }

  .spot-row { background: #fff; border: 1px solid #eeeee c; border-radius: 16px; overflow: hidden; cursor: pointer; transition: background 0.1s; }
  .spot-row { border: 1px solid #ebebeb; border-radius: 16px; }
  .spot-row:active { background: #f8f8f6; }
  .spot-img { width: 100%; height: 150px; object-fit: cover; display: block; background: #f0f0ee; }
  .spot-body { padding: 13px 15px; }
  .spot-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .spot-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; }
  .spot-chevron { font-size: 15px; color: #bbb; }
  .spot-name { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 3px; letter-spacing: -0.4px; }
  .spot-loc { font-size: 12px; color: #999; margin-bottom: 9px; display: flex; align-items: center; gap: 3px; }
  .spot-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .stag { font-size: 11px; padding: 3px 9px; border-radius: 8px; background: #f5f5f3; color: #666; border: 1px solid #ebebeb; }

  /* DETAIL */
  .list-view.hidden { display: none; }
  .detail-view { display: none; }
  .detail-view.open { display: block; }

  .detail-back { display: flex; align-items: center; gap: 5px; padding: 14px 16px 8px; cursor: pointer; }
  .detail-back span { font-size: 15px; color: #888; }
  .detail-img { width: 100%; height: 220px; object-fit: cover; display: block; background: #f0f0ee; }
  .detail-body { padding: 18px 16px 0; }
  .detail-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 4px; }
  .detail-name { font-size: 26px; font-weight: 700; color: #111; margin-bottom: 5px; letter-spacing: -0.6px; }
  .detail-loc { font-size: 13px; color: #888; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }
  .detail-desc { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 16px; }

  .pc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
  .pc-box { border-radius: 12px; padding: 12px 13px; background: #f8f8f6; }
  .pc-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .pc-lbl.p { color: #1a6e3c; }
  .pc-lbl.c { color: #9b3015; }
  .pc-item { font-size: 12px; color: #555; line-height: 1.45; padding: 3px 0 3px 14px; position: relative; }
  .pc-item.p::before { content: '+'; position: absolute; left: 0; color: #1a6e3c; font-weight: 700; }
  .pc-item.c::before { content: '−'; position: absolute; left: 0; color: #9b3015; font-weight: 700; }

  .meta-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .mchip { font-size: 12px; padding: 6px 11px; border-radius: 9px; background: #f5f5f3; color: #666; border: 1px solid #ebebeb; display: flex; align-items: center; gap: 4px; }

  .action-row { display: flex; gap: 9px; padding-bottom: 36px; }
  .act-btn { flex: 1; padding: 14px; border-radius: 13px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .act-maps { background: #111; color: #fff; }
  .act-save { background: #f5f5f3; color: #111; border: 1px solid #e0e0de; }
  .act-btn:active { opacity: 0.8; transform: scale(0.98); }
</style>
</head>
<body>
<div class="app">

  <!-- COVER -->
  <div class="cover" id="cover-screen">
    <img class="cover-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80" alt="OC beach" />
    <div class="cover-top">
      <div class="cover-date-pill">
        <i class="ti ti-calendar" style="font-size:13px;color:rgba(255,255,255,0.8);"></i>
        <span>Thursday, May 29</span>
      </div>
      <p class="cover-eyebrow">Orange County</p>
      <h1 class="cover-h1">Pick your<br><em>perfect</em><br>OC day.</h1>
      <p class="cover-credit">Designed by Jadon</p>
    </div>
    <div class="cover-bottom">
      <div class="cover-cats">
        <div class="cover-cat"><i class="ti ti-coffee" style="font-size:12px;"></i>Coffee</div>
        <div class="cover-cat"><i class="ti ti-compass" style="font-size:12px;"></i>Explore</div>
        <div class="cover-cat"><i class="ti ti-moon" style="font-size:12px;"></i>Dinner</div>
        <div class="cover-cat"><i class="ti ti-wave-sine" style="font-size:12px;"></i>Activity</div>
      </div>
      <div class="cover-divider"></div>
      <button class="cover-cta" onclick="enterApp()">
        Let's go <i class="ti ti-arrow-right" style="font-size:16px;"></i>
      </button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="main-view" id="main-view">
    <div class="topbar">
      <button class="back-btn" onclick="goToCover()" aria-label="Back to cover">
        <i class="ti ti-chevron-left" style="font-size:18px;"></i>
      </button>
      <div>
        <div class="topbar-title">Your OC day</div>
        <div class="topbar-date">Thursday, May 29</div>
      </div>
    </div>

    <div class="cats">
      <button class="cat-btn active" onclick="setCategory(this,'coffee')"><i class="ti ti-coffee"></i> Coffee</button>
      <button class="cat-btn" onclick="setCategory(this,'explore')"><i class="ti ti-compass"></i> Explore</button>
      <button class="cat-btn" onclick="setCategory(this,'dinner')"><i class="ti ti-moon"></i> Dinner</button>
      <button class="cat-btn" onclick="setCategory(this,'activity')"><i class="ti ti-wave-sine"></i> Activity</button>
    </div>

    <div id="list-view" class="list-view">
      <div class="section-head">
        <span class="section-title" id="section-label"></span>
        <span class="section-sub" id="section-count"></span>
      </div>
      <div class="spot-list" id="spot-list"></div>
    </div>

    <div id="detail-view" class="detail-view">
      <div class="detail-back" onclick="closeDetail()">
        <i class="ti ti-chevron-left" style="font-size:18px;color:#888;"></i>
        <span id="back-label"></span>
      </div>
      <img id="d-img" class="detail-img" src="" alt="" />
      <div class="detail-body">
        <p class="detail-tag" id="d-tag"></p>
        <h2 class="detail-name" id="d-name"></h2>
        <p class="detail-loc" id="d-loc"></p>
        <p class="detail-desc" id="d-desc"></p>
        <div class="pc-grid">
          <div class="pc-box"><p class="pc-lbl p">Pros</p><div id="d-pros"></div></div>
          <div class="pc-box"><p class="pc-lbl c">Cons</p><div id="d-cons"></div></div>
        </div>
        <div class="meta-row" id="d-meta"></div>
        <div class="action-row">
          <button class="act-btn act-maps" onclick="openMaps()"><i class="ti ti-map-2"></i> Open in maps</button>
          <button class="act-btn act-save" onclick="saveSpot()"><i class="ti ti-bookmark" id="save-icon"></i> <span id="save-label">Save</span></button>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
const data = {
  coffee: {
    label: 'Coffee', count: '2 spots',
    spots: [
      { id:'lostbean', label:'Organic roaster', name:'The Lost Bean', location:'814 W Chapman Ave, Orange', hours:'Daily 7am–8pm', img:'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=The+Lost+Bean+814+W+Chapman+Ave+Orange+CA', desc:'Local OC institution roasting organic beans since 2005. Two full floors, private study rooms, and a full food menu — one of the most established indie cafés in the county.', tags:['Organic','Roastery','Work-friendly'], pros:['In-house organic roasting — noticeably cleaner flavor','Two floors + private group rooms','Full food menu: quiches, egg dishes, pastries'], cons:['Industrial vibe can feel cold with the AC on','Gets packed during peak study hours','Parking is hit-or-miss on weekends'] },
      { id:'grid', label:'Specialty café', name:'Grid Coffee', location:'3380 S Bristol St, Santa Ana', hours:'Mon–Thu 7am–5:30pm · Fri 7am–8pm', img:'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=Grid+Coffee+3380+S+Bristol+St+Santa+Ana+CA', desc:'Sleek all-black minimalist café near South Coast Plaza that went viral on TikTok. Known for a killer matcha program and one of the most photogenic interiors in OC.', tags:['Minimalist','Matcha','Aesthetic'], pros:['Most photogenic café in OC — great for photos','Exceptional matcha: blueberry, hojicha, coconut','Spacious low-table seating, easy vibe'], cons:['Closes at 5:30pm most weekdays','Feels more like a workspace than a social hangout','Some non-coffee drinks noted as watery'] }
    ]
  },
  explore: {
    label: 'Explore', count: '3 spots · Costa Mesa',
    spots: [
      { id:'ocma', label:'Museum · Free entry', name:'OCMA', location:'3333 Bear St, Costa Mesa', hours:'Tue–Sun 11am–5pm', img:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=OCMA+3333+Bear+St+Costa+Mesa+CA', desc:'The Orange County Museum of Art — free admission and a genuinely cool space for contemporary art. The building itself is photogenic and the rotating exhibitions are always worth exploring.', tags:['Free','Art','Photos'], pros:['Completely free — no excuse not to go','Photogenic space, great for content','Solid rotating contemporary art exhibitions'], cons:['Can feel short — not sure what to do right after','Might be slow if modern art isn\'t your thing','Closes at 5pm so time it right'] },
      { id:'2ndstreet', label:'Shopping · The Camp', name:'2nd Street / The Camp', location:'2937 Bristol St, Costa Mesa', hours:'Daily · hours vary by shop', img:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=The+Camp+2937+Bristol+St+Costa+Mesa+CA', desc:'An outdoor anti-mall with indie boutiques, local food spots, and a laid-back SoCal vibe. Good for wandering, people-watching, and stumbling onto something unexpected.', tags:['Outdoor','Boutiques','Chill vibe'], pros:['Great atmosphere for walking and exploring','Indie brands you won\'t find at a regular mall','Easy to kill an hour without spending much'], cons:['Easy to leave without buying anything','Hit or miss depending on which shops are open','Nothing super unique if you\'ve done similar spots before'] },
      { id:'hidn', label:'Concept store', name:'HIDN', location:'Costa Mesa', hours:'Check before going — hours vary', img:'https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=HIDN+Costa+Mesa+CA', desc:'A curated concept store carrying rare streetwear, art objects, and design pieces. Worth a visit if you\'re into elevated streetwear culture — more of a browse than a buy.', tags:['Streetwear','Rare finds','Concept store'], pros:['Super cool, curated space — great for inspo','Unique pieces you genuinely can\'t find anywhere else','Good energy and aesthetic worth seeing'], cons:['Everything is expensive — budget accordingly','May need an appointment — confirm before going','Could be a quick in-and-out if budget is tight'] }
    ]
  },
  dinner: {
    label: 'Dinner', count: '2 spots · Costa Mesa',
    spots: [
      { id:'thaizakaya', label:'Thai-Japanese fusion', name:'Thaizakaya (ETC Bar)', location:'355 Bristol St, Costa Mesa', hours:'Tue–Sat 3pm–10pm · Sun–Mon closed', img:'https://images.unsplash.com/photo-1617196034183-421b4040ed20?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=ETC+Bar+Thaizakaya+355+Bristol+St+Costa+Mesa+CA', desc:'Sister restaurant to Hanuman, blending Thai and Japanese izakaya culture into one creative menu. Bold sharing plates, craft cocktails, and a vibe perfect for a group dinner. The duck curry alone is worth the trip.', tags:['Fusion','Izakaya','Cocktails'], pros:['Unique Thai-Japanese concept — genuinely creative menu','Duck curry is a top-5 OC dish according to regulars','Great cocktail program with Thai and Japanese flavors'], cons:['Reservations recommended on weekends','Closed Sunday and Monday','Newer spot — can still feel like it\'s finding its footing'] },
      { id:'hanuman', label:'Thai eatery', name:'Hanuman Thai Eatery', location:'355 Bristol St, Costa Mesa', hours:'Mon–Sat 3pm–10pm · Sun closed', img:'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=Hanuman+Thai+Eatery+355+Bristol+St+Costa+Mesa+CA', desc:'One of the most acclaimed Thai restaurants in OC. Chef Jenny brings southern Thai flavors — Hat Yai fried chicken, Khao Soi, Hanuman ceviche — to a modern, upscale space. A genuine must-try.', tags:['Thai','Elevated','Seasonal'], pros:['Consistently rated top Thai in OC — food is on another level','Hat Yai fried chicken and Penang curry are must-orders','Beautiful interior, great for a proper dinner out'], cons:['45–60 min wait on Fri/Sat — join waitlist early','Closed Sundays','Pricier than typical Thai, though portions are solid'] }
    ]
  },
  activity: {
    label: 'Activity', count: 'End the night right',
    spots: [
      { id:'newport', label:'Night out · Newport Beach', name:'Newport Beach', location:'Balboa Peninsula, Newport Beach', hours:'Open all night', img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80', mapsUrl:'https://maps.apple.com/?q=Balboa+Peninsula+Newport+Beach+CA', desc:'End the night at Newport Beach. Walk the Balboa Peninsula, grab something from the boardwalk, and vibe by the water. The perfect low-effort, high-reward OC ending.', tags:['Beach','Night vibes','Newport'], pros:['Nothing beats the beach after dinner','Boardwalk has food spots and solid people-watching','Night vibe at Newport is completely different from daytime'], cons:['Can be cold at night — bring a layer','Boardwalk parking fills up fast on weekends','Not much to do beyond walking and vibing — that\'s the point'] }
    ]
  }
};

let currentCategory = 'coffee';
let currentSpot = null;
let saved = new Set();

function enterApp() {
  document.getElementById('cover-screen').style.display = 'none';
  document.getElementById('main-view').classList.add('open');
  window.scrollTo(0,0);
  renderList();
}

function goToCover() {
  document.getElementById('cover-screen').style.display = 'flex';
  document.getElementById('main-view').classList.remove('open');
  window.scrollTo(0,0);
  closeDetail();
}

function setCategory(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = cat;
  closeDetail();
  renderList();
  window.scrollTo(0,0);
}

function renderList() {
  const cat = data[currentCategory];
  if (!cat) return;
  document.getElementById('section-label').textContent = cat.label;
  document.getElementById('section-count').textContent = cat.count;
  document.getElementById('spot-list').innerHTML = cat.spots.map(s => `
    <div class="spot-row" onclick="openDetail('${s.id}')" role="button" aria-label="View ${s.name}">
      <img class="spot-img" src="${s.img}" alt="${s.name}" loading="lazy" />
      <div class="spot-body">
        <div class="spot-top">
          <span class="spot-label">${s.label}</span>
          <i class="ti ti-chevron-right spot-chevron"></i>
        </div>
        <div class="spot-name">${s.name}</div>
        <div class="spot-loc"><i class="ti ti-map-pin" style="font-size:12px;"></i> ${s.location}</div>
        <div class="spot-tags">${s.tags.map(t=>`<span class="stag">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function openDetail(id) {
  const s = data[currentCategory].spots.find(x => x.id === id);
  if (!s) return;
  currentSpot = s;
  document.getElementById('d-img').src = s.img;
  document.getElementById('d-img').alt = s.name;
  document.getElementById('d-tag').textContent = s.label;
  document.getElementById('d-name').textContent = s.name;
  document.getElementById('d-loc').innerHTML = `<i class="ti ti-map-pin" style="font-size:12px;"></i> ${s.location}`;
  document.getElementById('d-desc').textContent = s.desc;
  document.getElementById('d-pros').innerHTML = s.pros.map(p=>`<div class="pc-item p">${p}</div>`).join('');
  document.getElementById('d-cons').innerHTML = s.cons.map(c=>`<div class="pc-item c">${c}</div>`).join('');
  document.getElementById('d-meta').innerHTML = `<div class="mchip"><i class="ti ti-clock"></i> ${s.hours}</div>` + s.tags.map(t=>`<div class="mchip">${t}</div>`).join('');
  document.getElementById('back-label').textContent = data[currentCategory].label;
  updateSaveBtn();
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('open');
  window.scrollTo(0,0);
}

function closeDetail() {
  document.getElementById('detail-view').classList.remove('open');
  document.getElementById('list-view').classList.remove('hidden');
  window.scrollTo(0,0);
}

function openMaps() {
  if (currentSpot) window.open(currentSpot.mapsUrl, '_blank');
}

function saveSpot() {
  if (!currentSpot) return;
  saved.has(currentSpot.id) ? saved.delete(currentSpot.id) : saved.add(currentSpot.id);
  updateSaveBtn();
}

function updateSaveBtn() {
  if (!currentSpot) return;
  const on = saved.has(currentSpot.id);
  document.getElementById('save-label').textContent = on ? 'Saved' : 'Save';
  document.getElementById('save-icon').className = on ? 'ti ti-bookmark-filled' : 'ti ti-bookmark';
}

renderList();
</script>
</body>
</html>
